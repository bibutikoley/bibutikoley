name: Profile stats

# Regenerates the SVG cards embedded in README.md and commits them, so the
# README never depends on a third-party image service at render time.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    # Only the generator itself retriggers this, so committing the generated
    # assets below cannot start a loop.
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/generate_stats.py'

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stat cards
        env:
          # STATS_TOKEN is optional: a personal access token with read:user
          # widens the stats to private contributions. Without it the built-in
          # token is used and the cards reflect public activity only.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          python3 scripts/generate_stats.py \
            --login "${{ github.repository_owner }}" \
            --out assets \
            --readme README.md \
            --dump-json data/profile.json

      - name: Commit updated cards
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data README.md
          if git diff --staged --quiet; then
            echo 'Stat cards unchanged.'
          else
            git commit -m 'chore: refresh profile stat cards'
            git push origin HEAD:${{ github.ref_name }}
          fi
