<svg xmlns="http://www.w3.org/2000/svg" width="460" height="150" viewBox="0 0 460 150" role="img" aria-label="Most used languages">
<title>Most used languages</title>
<style>
    :root {
      --bg: #ffffff; --border: #d0d7de; --title: #0969da;
      --text: #1f2328; --muted: #656d76; --track: #eaeef2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --border: #30363d; --title: #58a6ff;
        --text: #e6edf3; --muted: #8b949e; --track: #21262d;
      }
    }
    .card { fill: var(--bg); stroke: var(--border); }
    .title { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: var(--title); }
    .label { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: var(--text); }
    .value { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: var(--text); }
    .muted { font: 400 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: var(--muted); }
</style>
<rect class="card" x="0.5" y="0.5" rx="6" width="459" height="149"/>
<text class="title" x="25" y="35">Most Used Languages</text>
<rect x="25" y="48" rx="5" width="410" height="10" fill="var(--track)"/>
<clipPath id="bar"><rect x="25" y="48" rx="5" width="410" height="10"/></clipPath>
<g clip-path="url(#bar)">
<rect x="25.00" y="48" width="135.60" height="10" fill="#3572A5"/>
<rect x="160.60" y="48" width="114.90" height="10" fill="#f1e05a"/>
<rect x="275.50" y="48" width="71.67" height="10" fill="#b07219"/>
<rect x="347.17" y="48" width="44.31" height="10" fill="#F05138"/>
<rect x="391.48" y="48" width="28.63" height="10" fill="#89e051"/>
<rect x="420.11" y="48" width="14.89" height="10" fill="#663399"/>
</g>
<circle cx="30" cy="80" r="5" fill="#3572A5"/>
<text class="label" x="42" y="84">Python 33.1%</text>
<circle cx="235" cy="80" r="5" fill="#f1e05a"/>
<text class="label" x="247" y="84">JavaScript 28.0%</text>
<circle cx="30" cy="102" r="5" fill="#b07219"/>
<text class="label" x="42" y="106">Java 17.5%</text>
<circle cx="235" cy="102" r="5" fill="#F05138"/>
<text class="label" x="247" y="106">Swift 10.8%</text>
<circle cx="30" cy="124" r="5" fill="#89e051"/>
<text class="label" x="42" y="128">Shell 7.0%</text>
<circle cx="235" cy="124" r="5" fill="#663399"/>
<text class="label" x="247" y="128">CSS 3.6%</text>
</svg>
