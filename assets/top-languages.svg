<svg xmlns="http://www.w3.org/2000/svg" width="460" height="150" viewBox="0 0 460 150" role="img" aria-label="Most used languages">
<title>Most used languages</title>
<style>
    :root {
      --bg: #ffffff; --border: #d0d7de; --title: #0969da;
      --text: #1f2328; --muted: #656d76; --track: #eaeef2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --border: #30363d; --title: #58a6ff;
        --text: #e6edf3; --muted: #8b949e; --track: #21262d;
      }
    }
    .card { fill: var(--bg); stroke: var(--border); }
    .title { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: var(--title); }
    .label { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: var(--text); }
    .value { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: var(--text); }
    .muted { font: 400 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: var(--muted); }
</style>
<rect class="card" x="0.5" y="0.5" rx="6" width="459" height="149"/>
<text class="title" x="25" y="35">Most Used Languages</text>
<rect x="25" y="48" rx="5" width="410" height="10" fill="var(--track)"/>
<clipPath id="bar"><rect x="25" y="48" rx="5" width="410" height="10"/></clipPath>
<g clip-path="url(#bar)">
<rect x="25.00" y="48" width="195.07" height="10" fill="#b07219"/>
<rect x="220.07" y="48" width="121.88" height="10" fill="#3572A5"/>
<rect x="341.95" y="48" width="59.88" height="10" fill="#A97BFF"/>
<rect x="401.83" y="48" width="17.34" height="10" fill="#00B4AB"/>
<rect x="419.17" y="48" width="9.46" height="10" fill="#e34c26"/>
<rect x="428.63" y="48" width="6.37" height="10" fill="#F05138"/>
</g>
<circle cx="30" cy="80" r="5" fill="#b07219"/>
<text class="label" x="42" y="84">Java 47.6%</text>
<circle cx="235" cy="80" r="5" fill="#3572A5"/>
<text class="label" x="247" y="84">Python 29.7%</text>
<circle cx="30" cy="102" r="5" fill="#A97BFF"/>
<text class="label" x="42" y="106">Kotlin 14.6%</text>
<circle cx="235" cy="102" r="5" fill="#00B4AB"/>
<text class="label" x="247" y="106">Dart 4.2%</text>
<circle cx="30" cy="124" r="5" fill="#e34c26"/>
<text class="label" x="42" y="128">HTML 2.3%</text>
<circle cx="235" cy="124" r="5" fill="#F05138"/>
<text class="label" x="247" y="128">Swift 1.6%</text>
</svg>
